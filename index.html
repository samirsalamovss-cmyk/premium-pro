  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      projectId: "outstanding-condition-bxjsq",
      appId: "1:209241238373:web:b1926486641326753c0f8c",
      apiKey: "AIzaSyAnExVgdJ1-uxoROHjrpABcldySgJgFniQ",
      authDomain: "outstanding-condition-bxjsq.firebaseapp.com",
      firestoreDatabaseId: "ai-studio-premiumchemicals-2530df4e-dc21-4636-80b5-d8debf298e81"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const firestore = getFirestore(app, firebaseConfig.firestoreDatabaseId);

      onSnapshot(doc(firestore, "company", "database"), (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          if (data && Array.isArray(data.products) && data.products.length > 0) {
            window.products = data.products;
            if (data.clients) window.clients = data.clients;
            if (data.invoices) window.invoices = data.invoices;
            if (data.debts) window.debts = data.debts;
            if (data.expenses) window.expenses = data.expenses;
            localStorage.setItem("pc_products", JSON.stringify(data.products));
            localStorage.setItem("pc_db_ver", "2.6");
            if (typeof window.syncLocalVars === 'function') window.syncLocalVars(data);
            if (window.renderContent) window.renderContent();
          }
        }
      });

      window.syncToCloud = async function() {
        try {
          await setDoc(doc(firestore, "company", "database"), {
            products: window.products || [],
            clients: window.clients || [],
            invoices: window.invoices || [],
            expenses: window.expenses || [],
            debts: window.debts || [],
            updatedAt: new Date().toISOString()
          });
        } catch(e) {
          console.warn("Cloud push error:", e);
        }
      };
    } catch(e) {
      console.warn("Firebase init note:", e);
    }
  </script>

      } catch (e) {
        return fallback;
      }
    }

    function saveLocal(key, val) {
      localStorage.setItem(key, JSON.stringify(val));
    }

    const isResetRequested = window.location.search.includes('v=') || window.location.search.includes('reset') || window.location.search.includes('sync');
    const storedVer = localStorage.getItem('pc_db_ver');
    let products = loadLocal('pc_products', DEFAULT_PRODUCTS);

    // If version changed, reset requested, or fewer than 10 products, or old products without image, force update to full catalog
    if (isResetRequested || storedVer !== DB_VERSION || !Array.isArray(products) || products.length <= 4 || !products[0]?.image) {
      products = DEFAULT_PRODUCTS;
      localStorage.setItem('pc_products', JSON.stringify(DEFAULT_PRODUCTS));
      localStorage.setItem('pc_db_ver', DB_VERSION);
    }

    let clients = loadLocal('pc_clients', DEFAULT_CLIENTS);
    let debts = loadLocal('pc_debts', DEFAULT_DEBTS);
    let expenses = loadLocal('pc_expenses', DEFAULT_EXPENSES);
    let invoices = loadLocal('pc_invoices', DEFAULT_INVOICES);
    let settings = loadLocal('pc_settings', DEFAULT_SETTINGS);

    window.syncLocalVars = function(data) {
      if (data.products && Array.isArray(data.products) && data.products.length > 0) {
        products = data.products;
      }
      if (data.clients) clients = data.clients;
      if (data.debts) debts = data.debts;
      if (data.expenses) expenses = data.expenses;
      if (data.invoices) invoices = data.invoices;
    };

    window.forceSync = function() {
      products = DEFAULT_PRODUCTS;
      localStorage.setItem('pc_products', JSON.stringify(DEFAULT_PRODUCTS));
      localStorage.setItem('pc_db_ver', DB_VERSION);
      if (window.syncToCloud) {
        window.syncToCloud();
      }
      renderContent();
      alert('Каталог успешно обновлён! Загружено товаров: ' + products.length);
    };

    let cart = [];
    let selectedClientId = clients[0]?.id || '';
    let currentTab = 'catalog';
    let catalogFilter = 'all';
    let searchQuery = '';
    let sortBy = 'default';

    function formatMoney(amount) {
      return (Number(amount) || 0).toFixed(2) + ' ₼';
    }

    // Switch Tab
    function switchTab(tab) {
      currentTab = tab;
      ['catalog', 'clients', 'finance', 'analytics'].forEach((t) => {
        const el = document.getElementById('nav-' + t);
        if (el) {
          if (t === tab) {
            el.className = 'flex flex-col items-center flex-1 py-1 text-neonOrange font-bold';
          } else {
            el.className = 'flex flex-col items-center flex-1 py-1 text-slate-400 font-bold';
          }
        }
      });
      renderContent();
    }

    // Add to Cart
    function addToCart(productId) {
      const prod = products.find((p) => p.id === productId);
      if (!prod) return;
      const exist = cart.find((i) => i.productId === productId);
      if (exist) {
        exist.quantity += 1;
        exist.total = exist.quantity * exist.unitPrice;
      } else {
        cart.push({
          productId: prod.id,
          productName: prod.name,
          volume: prod.volume,
          quantity: 1,
          unitPrice: prod.price,
          costPrice: prod.costPrice || 0,
          isGift: false,
          total: prod.price,
        });
      }
      updateCartCounter();
      renderContent();
    }

    function updateCartCounter() {
      const total = cart.reduce((s, i) => s + i.quantity, 0);
      const badge = document.getElementById('cart-counter');
      if (badge) {
        if (total > 0) {
          badge.innerText = total;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      }
    }

    // Render Views
    function renderContent() {
      const container = document.getElementById('app-content');
      if (!container) return;

      if (currentTab === 'catalog') {
        renderCatalog(container);
      } else if (currentTab === 'clients') {
        renderClients(container);
      } else if (currentTab === 'finance') {
        renderFinance(container);
      } else if (currentTab === 'analytics') {
        renderAnalytics(container);
      }
    }

    function renderCatalog(container) {
      const q = searchQuery.trim().toLowerCase();
      let filtered = products.filter((p) => {
        // Exclude autochemistry
        if (p.category.toLowerCase().includes('авто')) return false;
        if (catalogFilter !== 'all' && p.category !== catalogFilter) return false;
        if (q) {
          const matchName = (p.name || '').toLowerCase().includes(q);
          const matchCode = (p.code || '').toLowerCase().includes(q);
          const matchVolume = (p.volume || '').toLowerCase().includes(q);
          const matchCat = (p.category || '').toLowerCase().includes(q);
          if (!matchName && !matchCode && !matchVolume && !matchCat) return false;
        }
        return true;
      });

      // Apply Sorting
      if (sortBy === 'name-asc') {
        filtered.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'));

        filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
      } else if (sortBy === 'price-desc') {

      } else if (sortBy === 'stock-desc') {
        filtered.sort((a, b) => (b.stock || 0) - (a.stock || 0));

      container.innerHTML = `

                <option value="default" ${sortBy === 'default' ? 'selected' : ''}>↕️ Сортировка: По умолчанию</option>
                <option value="name-asc" ${sortBy === 'name-asc' ? 'selected' : ''}>🔤 По названию (А → Я)</option>
                <option value="price-asc" ${sortBy === 'price-asc' ? 'selected' : ''}>💰 Сначала дешевле (₼ ↗)</option>
                <option value="price-desc" ${sortBy === 'price-desc' ? 'selected' : ''}>💎 Сначала дороже (₼ ↘)</option>
                <option value="stock-desc" ${sortBy === 'stock-desc' ? 'selected' : ''}>📦 По остатку (много на складе)</option>
                <option value="stock-asc" ${sortBy === 'stock-asc' ? 'selected' : ''}>⚠️ По остатку (заканчивается)</option>
              </select>
            </div>
          </div>

          <!-- Category Pills -->
          <div class="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-none">
            ${categories.map((c) => `
              <button onclick="catalogFilter = '${c.id}'; renderContent();" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-colors ${catalogFilter === c.id ? 'bg-neonOrange text-white shadow-md shadow-neonOrange/20' : 'bg-brandCard border border-brandBorder text-slate-400'}">
                ${c.label}
              </button>
            `).join('')}
          </div>

          <!-- Counter info -->
          <div class="flex items-center justify-between text-[11px] text-slate-400 px-1">
            <span>Найдено позиций: <strong class="text-white">${filtered.length}</strong></span>
            ${searchQuery ? `<span class="text-neonOrange">Фильтр: «${searchQuery}»</span>` : ''}

          <!-- Product Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            ${filtered.length === 0 ? `<div class="col-span-full py-12 text-center text-slate-400 bg-brandCard border border-brandBorder rounded-2xl">Ничего не найдено по запросу «${searchQuery}»</div>` : ''}
            ${filtered.map((p) => {
              const inCart = cart.find((i) => i.productId === p.id);
              const isOut = (p.stock || 0) <= 0;
              return `
                <div class="bg-brandCard border border-brandBorder rounded-2xl p-3 sm:p-3.5 flex flex-col justify-between shadow-lg relative group hover:border-slate-700 transition-all">
                  <div class="flex gap-3 items-start">
                    <!-- Photo thumbnail with volume tag -->
                    <div class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-xl bg-brandDark border border-brandBorder overflow-hidden shrink-0 flex items-center justify-center">
                      ${p.image ? `<img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover rounded-xl" loading="lazy" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'text-[9px] text-slate-500 font-bold\\'>PC PRO</div>';" />` : `<div class="text-[9px] text-slate-500 font-bold">PC PRO</div>`}
                      <div class="absolute bottom-1 right-1 px-1.5 py-0.5 rounded bg-brandDark/90 text-[10px] font-bold text-electroCyan border border-brandBorder">${p.volume}</div>
                    </div>

                    <!-- Info -->
                    <div class="flex-1 min-w-0">
                      <div class="text-[10px] font-bold text-electroCyan uppercase tracking-wider">${p.category}</div>
                      <h3 class="font-bold text-sm text-white mt-0.5 leading-snug line-clamp-2">${p.name}</h3>
                      <div class="mt-1.5 text-xs ${isOut ? 'text-crimsonRed font-bold' : 'text-slate-400'}">
                        Остаток на складе: <strong>${p.stock} шт</strong>
                      </div>
                    </div>
                  </div>

                  <div class="mt-3.5 pt-3 border-t border-brandBorder/80 flex items-center justify-between">
                    <div>
                      <div class="text-lg font-black text-white">${formatMoney(p.price)}</div>
                      <div class="text-[10px] text-slate-500">Себест: ${formatMoney(p.costPrice)}</div>
                    </div>
                    <button onclick="addToCart('${p.id}')" class="px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${inCart ? 'bg-neonOrange text-white' : 'bg-brandBorder hover:bg-slate-700 text-white border border-electroCyan/30'}">
                      ${inCart ? inCart.quantity + ' в чеке' : '+ В накладную'}
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderClients(container) {
      container.innerHTML = `
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-sm font-bold text-white uppercase tracking-wider">CRM Контрагенты (${clients.length})</h2>
          </div>
          <div class="space-y-2">
            ${clients.map((c) => `
              <div class="bg-brandCard border border-brandBorder rounded-2xl p-3.5 flex flex-col gap-2">

                  <div class="flex items-center gap-2.5">
                    <div class="w-10 h-10 rounded-full bg-brandDark border border-brandBorder flex items-center justify-center font-black text-neonOrange text-sm">
                      ${c.name.charAt(0)}
                    </div>

                      <h4 class="font-bold text-sm text-white">${c.name}</h4>

                  <a href="tel:${c.phone}" class="px-3 py-1.5 rounded-xl bg-brandBorder text-xs text-white font-bold">Позвонить</a>
                  <a href="https://api.whatsapp.com/send?phone=${c.phone.replace(/[^\d]/g, '')}" target="_blank" class="px-3 py-1.5 rounded-xl bg-emeraldGreen text-xs text-white font-bold">WhatsApp</a>
                  <button onclick="dispatchDriver('${c.id}')" class="ml-auto px-3 py-1.5 rounded-xl bg-neonOrange text-xs text-white font-bold">Маршрут водителю</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function dispatchDriver(clientId) {
      const c = clients.find((item) => item.id === clientId);
      if (!c) return;
      const text = `🚚 МАРШРУТ ВОДИТЕЛЮ PREMIUM PRO\nКлиент: ${c.name}\nТел: ${c.phone}\nАдрес: ${c.address || 'Адрес не указан'}\nТочка: ${c.geoLink || 'Ссылка не указана'}`;
      window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(text), '_blank');
    }

    function renderFinance(container) {
      const totalRev = invoices.reduce((s, i) => s + (i.total || 0), 0);
      const totalCOGS = invoices.reduce((s, i) => s + (i.totalCostPrice || 0), 0);
      const totalGifts = invoices.reduce((s, i) => s + (i.giftCostPrice || 0), 0);
      const totalExp = expenses.reduce((s, e) => s + (e.amount || 0), 0);
      const netProfit = totalRev - totalCOGS - totalGifts - totalExp;

      const receivables = debts.filter(d => d.type === 'client_receivable').reduce((s, d) => s + d.positions.reduce((ps, p) => ps + p.remainingAmount, 0), 0);
      const suppliersDebt = debts.filter(d => d.type === 'supplier').reduce((s, d) => s + d.positions.reduce((ps, p) => ps + p.remainingAmount, 0), 0);
      const ownerCredits = debts.filter(d => d.type === 'credit').reduce((s, d) => s + d.positions.reduce((ps, p) => ps + p.remainingAmount, 0), 0);

      container.innerHTML = `
        <div class="space-y-4">
          <!-- P&L Header -->
          <div class="bg-gradient-to-br from-brandCard to-emeraldGreen/15 border border-emeraldGreen/40 rounded-2xl p-4 shadow-xl">

            <div class="text-3xl font-black text-emeraldGreen mt-1">${formatMoney(netProfit)}</div>
            <p class="text-[11px] text-slate-400 mt-1">Выручка: ${formatMoney(totalRev)} − Себестоимость: ${formatMoney(totalCOGS)} − Расходы: ${formatMoney(totalExp)}</p>

            <div class="bg-brandCard border border-neonOrange/40 p-3 rounded-2xl">
              <span class="text-slate-400">Долг поставщикам сырья:</span>
              <div class="text-lg font-black text-neonOrange mt-0.5">${formatMoney(suppliersDebt)}</div>
            </div>
            <div class="bg-brandCard border border-crimsonRed/40 p-3 rounded-2xl">
              <span class="text-slate-400">Личные кредиты владельца:</span>
              <div class="text-lg font-black text-crimsonRed mt-0.5">${formatMoney(ownerCredits)}</div>
            </div>
          </div>
        </div>
      `;
    }

        <div class="space-y-4">

                <span class="text-[10px] font-bold text-neonOrange uppercase tracking-wider">История продаж и накладных</span>

            ${invoices.length === 0 ? `

                  <div class="flex items-start justify-between border-b border-brandBorder/70 pb-2.5">

    window.shareInvoiceWhatsApp = function(invId) {
      const inv = invoices.find((i) => i.id === invId);
      if (!inv) return;
      let text = '🧾 НАКЛАДНАЯ PREMIUM CHEMICALS PRO\n';
      text += 'Номер чека: № ' + inv.number + '\n';
      text += 'Дата: ' + new Date(inv.date).toLocaleString('ru-RU') + '\n';
      text += 'Клиент: ' + (inv.clientName || 'Розничный покупатель') + '\n';
      text += '--------------------------------\n';
      (inv.items || []).forEach((item, idx) => {
        text += (idx + 1) + '. ' + item.productName + ' - ' + item.quantity + ' шт × ' + item.unitPrice + ' ₼ = ' + item.total + ' ₼\n';
      });
      text += '--------------------------------\n';
      text += 'ИТОГО К ОПЛАТЕ: ' + inv.total + ' ₼\n';
      text += 'Благодарим за сотрудничество! 📞 +994 50 635 00 13';
      window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(text), '_blank');
    };

    // Modal Cart & JPEG generator
    function openInvoiceCart() {
      const modal = document.getElementById('invoice-modal-container');
      if (!modal) return;
      const subtotal = cart.reduce((s, i) => s + (i.isGift ? 0 : i.total), 0);

      modal.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
          <div class="w-full max-w-md bg-brandCard border border-neonOrange/40 rounded-2xl p-5 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between pb-3 border-b border-brandBorder">
              <h3 class="font-bold text-white">Накладная продажи</h3>
              <button onclick="document.getElementById('invoice-modal-container').innerHTML = '';" class="text-slate-400 hover:text-white">✕</button>
            </div>

            <div class="overflow-y-auto space-y-3 my-3 flex-1 text-xs">
              ${cart.length === 0 ? '<p class="text-center py-6 text-slate-400">Накладная пуста</p>' : ''}
              ${cart.map((it, idx) => `
                <div class="bg-brandDark p-2.5 rounded-xl border border-brandBorder flex justify-between items-center">
                  <div>
                    <div class="font-bold text-white">${it.productName}</div>
                    <div class="text-slate-400">${it.quantity} шт × ${formatMoney(it.unitPrice)}</div>
                  </div>
                  <div class="font-black text-neonOrange">${formatMoney(it.total)}</div>
                </div>
              `).join('')}
            </div>

            <div class="pt-3 border-t border-brandBorder space-y-2">
              <div class="flex justify-between text-sm font-black text-white">
                <span>ИТОГО К ОПЛАТЕ:</span>
                <span class="text-neonOrange">${formatMoney(subtotal)}</span>
              </div>
              <button onclick="finalizeSale()" class="w-full py-3 rounded-xl bg-neonOrange text-white font-black text-xs shadow-lg active:scale-95 transition-all">
                Сформировать накладную и чек JPEG
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function finalizeSale() {
      if (cart.length === 0) return;
      const subtotal = cart.reduce((s, i) => s + (i.isGift ? 0 : i.total), 0);
      const client = clients.find((c) => c.id === selectedClientId);

      const inv = {
        id: 'inv-' + Date.now(),
        number: String(invoices.length + 1).padStart(4, '0'),
        date: new Date().toISOString(),
        clientName: client ? client.name : 'Розничный покупатель',
        clientPhone: client ? client.phone : '',
        items: [...cart],
        total: subtotal,
        totalCostPrice: cart.reduce((s, i) => s + (i.costPrice * i.quantity), 0),
        giftCostPrice: 0,
      };

      invoices.unshift(inv);
      saveLocal('pc_invoices', invoices);

      // Deduct stock
      cart.forEach((item) => {
        const prod = products.find((p) => p.id === item.productId);
        if (prod) prod.stock -= item.quantity;
      });
      saveLocal('pc_products', products);
      if (typeof window !== 'undefined' && window.syncToCloud) {
        window.syncToCloud();
      }

      cart = [];
      updateCartCounter();
      document.getElementById('invoice-modal-container').innerHTML = '';
      alert('Накладная № ' + inv.number + ' успешно проведена и синхронизирована с облаком!');
      renderContent();
    }

    // Backup button handler
    const backupBtn = document.getElementById('btn-export-backup');
    if (backupBtn) {
      backupBtn.addEventListener('click', () => {
        const backupData = { products, clients, debts, expenses, invoices, settings, exportedAt: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'premium_pro_backup.json';
        a.click();
      });
    }

    // Expose renderContent globally for realtime updates
    window.renderContent = renderContent;

    // Initial render
    renderContent();
    updateCartCounter();
  </script>
</body>
</html>
